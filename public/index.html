<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShahanFX AI Advisor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; background: #1e1e1e; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 80vh; overflow: hidden; }
        .chat-header { background: #252525; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        .chat-header h1 { color: #f39c12; font-size: 20px; margin: 0; }
        .chat-header p { color: #888; font-size: 12px; margin: 5px 0 0 0; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #2ecc71; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message { background: #2c3e50; color: #ecf0f1; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; padding: 10px; background: #1e1e1e; border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; padding: 10px; border: none; border-radius: 5px; background: #2c3e50; color: #fff; font-size: 14px; outline: none; }
        .chat-input-area button { background: #f39c12; color: #fff; border: none; padding: 10px 15px; margin-left: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background: #d68910; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>ShahanFX AI Advisor</h1>
            <p>XAU/USD Smart Money & Market Assistant</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">سڵاو! من ڕاوێژکاری زیرەکی تۆم. دەتوانیت پرسیار سەبارەت بە بازاڕی زێڕ یان ستراتیژییەکانی تریدینگ بکەیت.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="پرسیارەکەت لێرە بنووسە..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">ناردن</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if (!messageText) return;

            const chatMessages = document.getElementById('chatMessages');

            // زیادکردنی نامەی بەکارهێنەر بۆ ڕوکار
            chatMessages.innerHTML += `<div class="message user-message">${messageText}</div>`;
            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // ناردنی داواکاری بۆ سێرڤەری ترموکس
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });
                const data = await response.json();
                
                const reply = data.reply || data.analysis || "وەڵامێک نەدۆزراوەتەوە.";
                chatMessages.innerHTML += `<div class="message ai-message">${reply}</div>`;
            } catch (err) {
                chatMessages.innerHTML += `<div class="message ai-message" style="color: #e74c3c;">[هەڵە] ناتوانرێت پەیوەندی بە سێرڤەرەوە بکرێت.</div>`;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
