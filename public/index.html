<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShahanFX AI Pro - Trading Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 50px; }
        .container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #f39c12; font-size: 24px; }
        .status { font-size: 18px; margin: 20px 0; font-weight: bold; }
        .running { color: #2ecc71; }
        .stopped { color: #e74c3c; }
        button { padding: 12px 25px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; color: white; margin: 10px; width: 80%; }
        .btn-start { background-color: #2ecc71; }
        .btn-stop { background-color: #e74c3c; }
        #log { margin-top: 20px; background: #000; padding: 10px; text-align: left; font-family: monospace; font-size: 12px; height: 150px; overflow-y: auto; border-radius: 5px; color: #00ff00; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ShahanFX AI Pro</h1>
        <p>XAU/USD Automated Trading System</p>
        <div class="status" id="statusText">Status: <span class="stopped">Stopped</span></div>
        <button class="btn-start" onclick="startBot()">START BOT</button>
        <button class="btn-stop" onclick="stopBot()">STOP BOT</button>
        <div id="log">System ready...</div>
    </div>

    <script>
        function logMessage(msg) {
            const logBox = document.getElementById('log');
            logBox.innerHTML += "<br>" + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function startBot() {
            document.getElementById('statusText').innerHTML = 'Status: <span class="running">Running...</span>';
            logMessage("[INFO] Bot started. Analyzing XAU/USD market...");
            
            try {
                const response = await fetch('/api/chat');
                const data = await response.json();
                logMessage("[AI ANALYSIS]: " + JSON.stringify(data.analysis).substring(0, 100) + "...");
            } catch (err) {
                logMessage("[ERROR] Failed to fetch AI analysis.");
            }
        }

        function stopBot() {
            document.getElementById('statusText').innerHTML = 'Status: <span class="stopped">Stopped</span>';
            logMessage("[INFO] Bot stopped by user.");
        }
    </script>
</body>
</html>
